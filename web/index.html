<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>xbm · X Bookmark Manager</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <h1 id="app-title">xbm · X 书签管理器</h1>
    <div id="status" class="status">…</div>
    <nav class="views">
      <button id="view-search" class="tab active" data-i18n="app.search">搜索</button>
      <button id="view-cat" class="tab" data-i18n="app.browse">分类浏览</button>
      <button id="view-map" class="tab" data-i18n="app.map">地图</button>
      <button id="view-timeline" class="tab" data-i18n="app.timeline">时间脉络</button>
      <button id="view-threads" class="tab" data-i18n="app.threads">线索</button>
    </nav>
    <button id="lang-toggle" class="tab" title="切换语言 / Switch language">EN</button>
  </header>

  <section id="searchview">
    <div class="searchbar">
      <input id="q" type="text" data-i18n-ph="search.placeholder"
             placeholder="语义或关键词搜索,回车执行" />
      <select id="mode">
        <option value="auto" selected data-i18n="mode.auto">混合</option>
        <option value="vector" data-i18n="mode.vector">语义</option>
        <option value="fts" data-i18n="mode.fts">关键词</option>
      </select>
      <button id="go" data-i18n="search.mode">搜索</button>
    </div>

    <div class="filters">
      <input id="f-author" type="text" data-i18n-ph="filter.author" placeholder="作者 handle" />
      <label><span data-i18n="filter.from">从</span> <input id="f-after" type="date" /></label>
      <label><span data-i18n="filter.to">到</span> <input id="f-before" type="date" /></label>
      <label><input id="f-media" type="checkbox" /> <span data-i18n="filter.mediaOnly">仅含媒体</span></label>
      <button id="sync" data-i18n="sync.btn">增量同步书签</button>
      <span id="sync-note"></span>
    </div>

    <div class="progress-wrap">
      <div class="embed-ctl">
        <label><span data-i18n="embed.backend">嵌入后端</span>
          <select id="embed-backend">
            <option value="gpu" selected data-i18n="embed.gpu">GPU(WebGPU,约 15 条/秒)</option>
            <option value="cpu" data-i18n="embed.cpu">CPU(约 9 条/秒)</option>
          </select>
        </label>
        <button id="btn-embed" class="ghost" data-i18n="embed.bulk">批量嵌入</button>
        <span id="embed-note" class="muted"></span>
      </div>
      <div id="embed-bar" class="bar"><div id="embed-fill"></div></div>
      <div id="embed-text" class="muted">—</div>
      <div id="backfill-note" class="muted"></div>
    </div>

    <main id="results">
      <p class="muted" data-i18n="results.empty">
        输入关键词开始搜索。首次使用:书签同步后,浏览器会用 WebGPU 自动完成语义嵌入。
      </p>
    </main>
  </section>

  <section id="catview" hidden>
    <div class="cat-toolbar">
      <select id="cluster-set">
        <option value="keyword" selected data-i18n="cat.kw">关键词聚类</option>
        <option value="llm" data-i18n="cat.llm">LLM 聚类</option>
      </select>
      <select id="cluster-granularity">
        <option value="vfine" data-i18n="gran.vfine">粒度:很细</option>
        <option value="fine" data-i18n="gran.fine">粒度:细</option>
        <option value="medium" selected data-i18n="gran.medium">粒度:适中</option>
        <option value="coarse" data-i18n="gran.coarse">粒度:粗</option>
      </select>
      <label class="muted"><input id="cluster-recluster" type="checkbox" checked />
        <span data-i18n="recluster">重新聚类</span></label>
      <span id="llm-fields" hidden>
        <select id="llm-style">
          <option value="chat" selected data-i18n="llm.style">OpenAI 兼容</option>
          <option value="systemone" data-i18n="llm.systemone">SystemOne 决策</option>
        </select>
        <input id="llm-base" type="text" placeholder="http://127.0.0.1:8080/v1" />
        <input id="llm-model" type="text" placeholder="model" />
        <button id="btn-llm-test" class="ghost" data-i18n="llm.test">测试连接</button>
        <span id="llm-test-result" class="muted"></span>
      </span>
      <button id="btn-cluster" data-i18n="cluster.run">生成聚类</button>
      <button id="btn-classify" class="ghost" data-i18n="cat.generate">生成 / 刷新分类</button>
      <span id="cat-note" class="muted"></span>
    </div>

    <h3 data-i18n="cat.chipsTitle">类目 <span class="muted" data-i18n="cat.chipsSub">(零样本语义)</span></h3>
    <div id="cat-chips" class="chips"></div>
    <h3 data-i18n="kw.chipsTitle">关键词聚类</h3>
    <div id="kw-chips" class="chips"></div>
    <h3 data-i18n="llm.chipsTitle">LLM 聚类</h3>
    <div id="llm-chips" class="chips"></div>
    <p class="muted" data-i18n="cat.intersectHint">
      三个维度可任意组合筛选(交集):点选高亮,再点一次取消。</p>
    <div id="cat-header"></div>
    <main id="cat-results"></main>
  </section>

  <section id="mapview" hidden>
    <div class="cat-toolbar">
      <select id="map-color">
        <option value="category" selected data-i18n="map.color.cat">着色:类目</option>
        <option value="kw" data-i18n="map.color.kw">着色:关键词聚类</option>
        <option value="llm" data-i18n="map.color.llm">着色:LLM 聚类</option>
      </select>
      <button id="btn-map-gen" class="ghost" data-i18n="map.regen">重新生成地图</button>
      <span id="map-note" class="muted"></span>
    </div>
    <div id="map-wrap">
      <canvas id="map-canvas"></canvas>
      <div id="map-tip" hidden></div>
      <div id="map-card" hidden></div>
    </div>
    <div id="map-legend" class="chips"></div>
  </section>

  <section id="timelineview" hidden>
    <div class="cat-toolbar">
      <select id="timeline-unit">
        <option value="month" selected data-i18n="timeline.unit.month">按月</option>
        <option value="quarter" data-i18n="timeline.unit.quarter">按季</option>
      </select>
      <select id="timeline-window">
        <option value="all" selected data-i18n="timeline.win.all">全部时间</option>
        <option value="24" data-i18n="timeline.win.24">近 24 个月</option>
        <option value="12" data-i18n="timeline.win.12">近 12 个月</option>
      </select>
      <button id="btn-timeline" data-i18n="timeline.generate">生成 / 重新生成</button>
      <span id="timeline-note" class="muted"></span>
    </div>
    <div id="timeline-narrative" class="narrative"></div>
    <details id="timeline-raw">
      <summary class="muted" data-i18n="timeline.raw">各期主题统计(原始数据)</summary>
      <div id="timeline-digest"></div>
    </details>
  </section>

  <section id="threadsview" hidden>
    <div class="cat-toolbar">
      <span class="muted" data-i18n="threads.hint">
        双轨视角:算法热点会周期性起伏,但「中断线索」是你曾经投入、被断供后遗忘的方向。</span>
      <button id="btn-thread-cards" class="ghost" data-i18n="threads.cards">生成线索解读(LLM)</button>
      <span id="threads-note" class="muted"></span>
    </div>
    <div id="threads-body"></div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
